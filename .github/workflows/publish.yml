name: Publish Tile

# Thin caller for the canonical fleet publish pipeline
# (jbaruch/coding-policy#206). publish-mode: as-is keeps koog's deliberate
# no-auto-bump contract (`tessl plugin publish` of the manifest version;
# a missing human bump surfaces as a red "version exists" run). Display name
# and the tile-content path filter are preserved.

on:
  push:
    branches: [main]
    # Only fire when tile-content paths change (mirrors the tile payload).
    paths:
      - 'rules/**'
      - 'skills/**'
      - 'evals/**'
      - 'tile.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - '.tesslignore'
  workflow_dispatch:

# as-is publish makes no commit/push and uses no OIDC — least privilege.
permissions:
  contents: read

jobs:
  publish:
    uses: jbaruch/coding-policy/.github/workflows/publish-plugin.yml@b7eb9d08b78f72810891aa5fe7bf3e4fa6eb55f6
    secrets:
      TESSL_TOKEN: ${{ secrets.TESSL_TOKEN }}
    with:
      publish-mode: as-is
      skill-review-credit-outage: skip
